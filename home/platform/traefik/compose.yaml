# Traefik, the only thing on the box that owns ports 80 and 443. make deploy installs this at
# /home/ichabod/platform/traefik/compose.yaml; start it there with `docker compose up -d`.
# Traefik builds its routes from container labels, so a new site is one compose file and no edit here.
# Update the version deliberately, and never let an application share this compose project: it holds the Docker socket.
#
# Three things that look broken and are not:
#   - A healthy Traefik logs nothing. The log level defaults to ERROR, and ACME failures do appear.
#   - The first request to a new hostname fails with "unable to get local issuer certificate" while issuance runs.
#   - The ACME account is pinned on first issuance. Changing the email below means deleting acme.json and re-issuing.
# Back up the letsencrypt volume, or expect to re-issue every certificate after a rebuild.

name: ichabod-proxy

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      # Only containers labelled traefik.enable=true get a route.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=ichabod@ichabod-crane.net
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # HTTP-01 challenges arrive on port 80, which is why 80 stays open to the world.
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  # Applications join this by name as an external network (home/templates/app/compose.yaml).
  proxy:
    name: ichabod-proxy

volumes:
  letsencrypt:
