# Starting point for an application under /srv/ichabod/apps/<slug>/.
# Copy it, then replace every <slug> and the port. The resource limits are not
# suggestions: they are the only ceiling on this box that Docker enforces
# rather than Ichabod remembering.

name: <slug>

services:
  web:
    build: .
    restart: unless-stopped
    # No published host port. Traefik reaches the container over the proxy
    # network, so exposing one would only open a second, unrouted door.
    expose:
      - "3000"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.<slug>.rule=Host(`<slug>.ichabod-crane.net`)"
      - traefik.http.routers.<slug>.entrypoints=websecure
      - traefik.http.routers.<slug>.tls.certresolver=letsencrypt
      - traefik.http.services.<slug>.loadbalancer.server.port=3000
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true
    name: ichabod-proxy
